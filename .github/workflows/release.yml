name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.8.1
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        # --ignore-scripts: better-sqlite3@13 ships N-API prebuilt binaries for
        # every platform we target, but npm's publish pipeline still injects an
        # implicit "node-gyp rebuild" install step whenever a binding.gyp file
        # is present (a known npm bug, see WiseLibs/better-sqlite3#1503). On
        # Windows runners without a supported Visual Studio toolchain this
        # implicit rebuild fails even though no compilation is actually needed.
        # None of our server dependencies rely on install/postinstall scripts,
        # so skipping lifecycle scripts here is safe.
        run: npm install --prefix server --ignore-scripts

      - name: Install web dependencies
        run: npm install --prefix web

      - name: Build frontend
        run: npm run build

      - name: Build & publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./node_modules/.bin/electron-builder --${{ matrix.platform }} --publish always
